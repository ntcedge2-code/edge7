name: Extract Amateur CSV

on:
  push:
    branches:
      - main
    paths:
      - 'I/**/*.csv'
      - 'II/**/*.csv'
      - 'III/**/*.csv'
      - 'IV/**/*.csv'
      - 'V/**/*.csv'
      - 'VI/**/*.csv'
      - 'VII/**/*.csv'
      - 'VIII/**/*.csv'
      - 'IX/**/*.csv'
      - 'X/**/*.csv'
      - 'XI/**/*.csv'
      - 'XII/**/*.csv'
      - 'XIII/**/*.csv'
      - 'XIV/**/*.csv'
      - 'CsvExtractor/**'
      - '.github/workflows/extract-csv.yml'

  workflow_dispatch:

jobs:
  extract-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./CsvExtractor/CsvExtractor.csproj

      - name: Build project
        run: dotnet build ./CsvExtractor/CsvExtractor.csproj --configuration Release --no-restore

      - name: Create output folder
        run: mkdir -p output

      - name: Run extraction and save to Cosmos DB
        env:
          COSMOS_CONNECTION_STRING: ${{ secrets.COSMOS_CONNECTION_STRING }}
          COSMOS_DATABASE_NAME: ${{ secrets.COSMOS_DATABASE_NAME }}
          COSMOS_CONTAINER_NAME: ${{ secrets.COSMOS_CONTAINER_NAME }}
        run: |
          echo "Searching CSV files..."

          find I II III IV V VI VII VIII IX X XI XII XIII XIV -type f -name "*.csv" 2>/dev/null > csv_files.txt || true

          echo "CSV files found:"
          cat csv_files.txt

          if [ ! -s csv_files.txt ]; then
            echo "No CSV files found."
            exit 0
          fi

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              echo "Processing file: $file"

              dotnet run \
                --project ./CsvExtractor/CsvExtractor.csproj \
                --configuration Release \
                -- "$file"
            fi
          done < csv_files.txt

      - name: List generated files
        run: |
          find . -type f
          ls -la output || true

      - name: Upload JSON outputs
        uses: actions/upload-artifact@v4
        with:
          name: amateur-applications-json
          path: output/*.json
          if-no-files-found: warn
