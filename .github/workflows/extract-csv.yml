name: Extract Amateur CSV

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  extract-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./CsvExtractor/CsvExtractor.csproj

      - name: Build project
        run: dotnet build ./CsvExtractor/CsvExtractor.csproj --configuration Release --no-restore

      - name: Run CSV extraction
        run: dotnet run --project ./CsvExtractor/CsvExtractor.csproj --configuration Release -- "AMATEUR Query.csv"