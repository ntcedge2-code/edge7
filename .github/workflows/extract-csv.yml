name: Extract Amateur CSV

on:
  push:
    branches:
      - main
    paths:
      - 'I/**/*.csv'
      - 'II/**/*.csv'
      - 'III/**/*.csv'
      - 'IV/**/*.csv'
      - 'V/**/*.csv'
      - 'VI/**/*.csv'
      - 'VII/**/*.csv'
      - 'VIII/**/*.csv'
      - 'IX/**/*.csv'
      - 'X/**/*.csv'
      - 'XI/**/*.csv'
      - 'XII/**/*.csv'
      - 'XIII/**/*.csv'
      - 'XIV/**/*.csv'
      - 'CsvExtractor/**'
      - '.github/workflows/extract-csv.yml'

  workflow_dispatch:

jobs:
  extract-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./CsvExtractor/CsvExtractor.csproj

      - name: Build project
        run: dotnet build ./CsvExtractor/CsvExtractor.csproj --configuration Release --no-restore

      - name: Find changed CSV files
        id: changed-files
        run: |
          echo "files<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only HEAD~1 HEAD | grep -E '^(I|II|III|IV|V|VI|VII|VIII|IX|X|XI|XII|XIII|XIV)/.*\.csv$' || true
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run extraction per CSV file
        run: |
          echo "${{ steps.changed-files.outputs.files }}" | while read file; do
            if [ -n "$file" ]; then
              folder=$(dirname "$file")
              echo "Processing folder: $folder"
              echo "Processing file: $file"

              dotnet run \
                --project ./CsvExtractor/CsvExtractor.csproj \
                --configuration Release \
                -- "$file"
            fi
          done

      - name: Upload JSON outputs
        uses: actions/upload-artifact@v4
        with:
          name: amateur-applications-json
          path: "*.json"
